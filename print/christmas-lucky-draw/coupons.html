<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hungryana Christmas Lucky Draw Coupons</title>
<!--
  Printable lucky-draw slips, 2.5in x 1.5in, 21 per A4 sheet (3 x 7).
  Open in Chrome/Edge and print at 100% scale ("Actual size"), margins: None.
  URL options:
    ?pages=24&start=1   numbered slips 0001..0504
    ?blank=1            no serial number (a master for photocopying)
-->
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sheet {
    width: 210mm; height: 297mm;
    display: grid;
    grid-template-columns: repeat(3, 2.5in);
    grid-template-rows: repeat(7, 1.5in);
    justify-content: center;
    align-content: center;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }

  .slip {
    position: relative;
    width: 2.5in; height: 1.5in;
    padding: 0.09in 0.12in 0.07in;
    border: 0.6pt dashed #9a9a9a;   /* cut lines */
    margin: -0.3pt;                  /* collapse the shared dashed edges */
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .slip::before {                   /* logo watermark */
    content: "";
    position: absolute; inset: 0;
    background: url("logo-watermark.png") center 58% / 1.75in auto no-repeat;
    opacity: 0.14;
    pointer-events: none;
  }
  .slip > * { position: relative; }

  .top { display: flex; align-items: center; gap: 3pt; }
  .top .logo { height: 0.3in; width: auto; flex: none; }
  .top .head { flex: 1; min-width: 0; }
  .top .row { display: flex; justify-content: space-between; align-items: baseline; }
  .title { white-space: nowrap; font-size: 7pt; font-weight: 800; color: #c8161d; letter-spacing: 0; text-transform: uppercase; }
  .serial { white-space: nowrap; font-size: 6.6pt; font-weight: 700; font-family: Consolas, "Courier New", monospace; color: #1a1a1a; }
  .serial.blank { font-family: inherit; font-weight: 600; color: #555; }
  .sub { font-size: 6.6pt; font-weight: 600; color: #8a5a00; margin-top: 1pt; }

  .field { display: flex; align-items: flex-end; gap: 4pt; margin-top: 8.5pt; font-size: 7.5pt; font-weight: 700; }
  .field .line { flex: 1; border-bottom: 0.8pt solid #333; height: 12pt; }

  .wa { display: flex; align-items: flex-start; gap: 4pt; margin-top: 6pt; font-size: 6.4pt; line-height: 1.2; margin-top: 7pt; }
  .box { flex: none; width: 8pt; height: 8pt; border: 0.9pt solid #1a1a1a; border-radius: 1pt; background: #fff; margin-top: 0.3pt; }

  .foot {
    margin-top: auto;
    font-size: 5.3pt; color: #444; text-align: center;
    border-top: 0.4pt solid #c8161d; padding-top: 1.5pt;
  }

  @media screen {
    body { background: #e9e9e9; padding: 16px 0; }
    .sheet { background: #fff; margin: 0 auto 16px; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const pages = Math.max(1, parseInt(q.get("pages") || "1", 10));
  const start = Math.max(1, parseInt(q.get("start") || "1", 10));
  const blank = q.has("blank");
  const PER_SHEET = 21;

  const slip = (n) => `
    <div class="slip">
      <div class="top">
        <img class="logo" src="logo-watermark.png" alt="Hungryana">
        <div class="head">
          <div class="row">
            <span class="title">Christmas Lucky Draw</span>
            ${blank ? `<span class="serial blank">No. ____</span>`
                    : `<span class="serial">No. ${String(n).padStart(4, "0")}</span>`}
          </div>
          <div class="sub">Win a FREE Fruit Cake &middot; 5 lucky winners</div>
        </div>
      </div>
      <div class="field">Name<span class="line"></span></div>
      <div class="field">Phone<span class="line"></span></div>
      <div class="wa"><span class="box"></span><span>Yes, send me Hungryana offers &amp; updates on WhatsApp</span></div>
      <div class="foot">Contest 20 Nov &ndash; 20 Dec 2026 &middot; Winners announced 22 Dec 2026</div>
    </div>`;

  let html = "", n = start;
  for (let p = 0; p < pages; p++) {
    html += '<section class="sheet">';
    for (let i = 0; i < PER_SHEET; i++) html += slip(n++);
    html += "</section>";
  }
  document.body.insertAdjacentHTML("beforeend", html);
</script>
</body>
</html>
